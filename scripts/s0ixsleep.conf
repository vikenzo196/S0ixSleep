# S0ixSleep configuration, read by s0ix-arm.sh at boot (copy to /usr/local/etc/s0ixsleep.conf).

# How the CPU waits between checks for a wake event (with 1 and 2 the core also runs at its lowest HWP level):
# 2 = MWAIT C10, woken by the local APIC timer every PERIOD ms. The package can reach its idle states.
#     Needs MWAIT, the TSC deadline timer and ARAT; if the CPU lacks one, the daemon falls back to 1.
# 1 = TPAUSE C0.2 for ~1 ms at a time. Simpler, but the package stays in PC0 (more power).
# 0 = plain PAUSE loop (only for debugging).
WAIT=2
# Wait 2: timer period in ms (5-1000). Up to this much extra delay before a wake event is noticed.
PERIOD=50

# Wake in the dark (display off, back to sleep after ~20 s) after N seconds of sleep, so that the battery
# guard below can run during a long sleep (0 = never). With ~5 W of sleep power a battery loses ~8 % per hour.
SAFETY=3600

# Battery guard (daemon): on battery, clean shutdown at or below these charges (%), a few seconds after a
# wake from sleep, or at any time while awake. Set to 0 to disable.
LOW_BATTERY_SLEEP=10
LOW_BATTERY_AWAKE=4

# Bag guard (daemon): after a wake from sleep, if nobody touches the keyboard or trackpad and the display is
# off for this many seconds, go back to sleep (0 = off). While /var/run/s0ixsleep-keepawake exists (it is removed
# at reboot) the bag guard waits: for remote or scripted work after a wake nobody touches.
BAG_GUARD=60

# Network interfaces taken down while the lid is closed and no display is on (asleep, or about to), back up when
# the lid opens or a display turns on. Example: SLEEP_IF_DOWN=en0. Empty = off (on the tested machine, with itlwm,
# it made no measurable difference to the sleep power, and a phone hotspot may be gone when the Wi-Fi comes back).
SLEEP_IF_DOWN=

# PCIe root ports (bb:dd.f, hex, comma separated) whose link goes to PCI-PM L1.2 during the sleep. macOS never enables
# L1 PM Substates, and a CPU root port whose link stays in plain L1 keeps its clock request asserted, which holds the
# package in PC3 (on the tested machine the NVMe SSD on 00:06.0 alone: ~1.5 W in PC3, ~0.3 W in PC10 with L1.2).
# Only when the device behind the port is in D3hot during the sleep; registers are put back at wake. The board must
# route CLKREQ# for that slot (Windows uses L1.2 there if it does). Find the port of the NVMe SSD with
#   ioreg -rc IOPCIDevice -n pci-bridge -l | grep pcidebug     (or: system_profiler SPNVMeDataType)
# Example: SLEEP_L12=00:06.0. Empty = off.
SLEEP_L12=

# 1 = bring the Intel Integrated Sensor Hub firmware up at boot and after each wake (the reset handshake of the Linux
# driver). With no driver the ISH firmware waits for the host forever and is never power gated, which keeps the
# chipset out of its deepest sleep state (SLP_S0); once up, with no client, it power gates itself. Intel ISH of
# Broxton to Raptor Lake only. 0 = off.
ISH_WAKE=0

# 1 = after a wake, run the firmware's _Qxx methods of the EC events that were ignored during the sleep, so
# that macOS sees battery and AC changes at once.
EC_REPLAY=1

# 1 = reset the Intel GT (render engine) before returning. Only for Intel Gen12+ (Tiger Lake and newer)
# graphics whose driver hangs after wake because it expects a GPU that lost power. Leave 0 otherwise.
GT_RESET=0

# Embedded controller events (hex, comma separated; the numbers of the firmware's _Qxx methods).
# Every EC event wakes the machine unless filtered. Sleep, wake, then read the last events with
#   sysctl debug.s0ix.stat   (ec_q=newest,...)
# EC_IGNORE: these events do not wake (battery, AC, thermal, fans...).
# EC_WAKE:   only these events wake (lid, power button, keyboard...); overrides EC_IGNORE.
EC_IGNORE=
EC_WAKE=

# Lid state in the embedded controller's RAM, read every 500 ms during the sleep: opening the lid wakes the
# laptop even when the EC does not send its lid event. Format byte.bit (hex byte, bit 0-7), 1 = open; prefix
# ~ when 0 = open. Find it in the DSDT: the EC field that the lid's _Qxx method copies into the variable _LID
# returns. Samsung Galaxy Book3: LID_EC=83.0 (LSTE). Empty = off.
LID_EC=

# Extra GPEs (hex) that end the sleep although macOS did not arm them for wake, for a lid or button whose GPE
# has no _PRW in the DSDT. Only useful if that GPE really fires under macOS. Empty = off.
WAKE_GPE=
